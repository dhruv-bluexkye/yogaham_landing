
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yogaham - Find Balance</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#7C9A8E",
              "primary-dark": "#5e756c",
              "background-light": "#F9FAF9",
              "background-dark": "#111814",
              "surface-light": "#FFFFFF",
              "surface-dark": "#1C2420",
              "text-main-light": "#2C3E36",
              "text-main-dark": "#E2E8E5",
              "text-muted-light": "#5F6F65",
              "text-muted-dark": "#9CA3AF",
            },
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
              display: ["Playfair Display", "serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
              xl: "1rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.19, 1, 0.22, 1)',
            }
          },
        },
      };
    </script>
    <style>
      html {
        scroll-padding-top: 100px; /* Offset for fixed header */
      }
      body {
        font-family: 'Outfit', sans-serif;
        /* Remove default scroll behavior here as we use tailwind's scroll-smooth on html */
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #7C9A8E;
        border-radius: 20px;
      }

      /* Animation Utilities */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 1s cubic-bezier(0.5, 0, 0, 1), transform 1s cubic-bezier(0.5, 0, 0, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      .stagger-1 { transition-delay: 100ms; }
      .stagger-2 { transition-delay: 200ms; }
      .stagger-3 { transition-delay: 300ms; }
      .stagger-4 { transition-delay: 400ms; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
